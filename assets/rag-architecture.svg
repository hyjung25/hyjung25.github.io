<svg width="920" height="560" viewBox="0 0 920 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Gangwon RAG Chatbot architecture</title>
  <desc id="desc">Architecture diagram showing crawled data, embedding and FAISS indexing, then a live query path through FastAPI, retrieval, reranking, local LLM generation, and multilingual answer output.</desc>
  <rect width="920" height="560" rx="24" fill="#F7F4EF"/>
  <rect x="32" y="32" width="856" height="496" rx="20" fill="#FFFFFF" stroke="#DED9D0" stroke-width="2"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#B85042"/>
    </marker>
  </defs>

  <text x="64" y="76" fill="#1B1E28" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30" font-weight="700">Gangwon RAG Chatbot</text>
  <text x="64" y="106" fill="#66707D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500">Offline indexing + live multilingual retrieval pipeline</text>

  <text x="64" y="146" fill="#B85042" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="700">OFFLINE DATA PIPELINE</text>
  <rect x="64" y="166" width="190" height="78" rx="14" fill="#FAF8F4" stroke="#DED9D0" stroke-width="2"/>
  <text x="88" y="197" fill="#1B1E28" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="700">Crawled Data</text>
  <text x="88" y="220" fill="#66707D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="500">Gangwon tourism / food</text>

  <line x1="274" y1="205" x2="332" y2="205" stroke="#B85042" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="352" y="166" width="190" height="78" rx="14" fill="#FAF8F4" stroke="#DED9D0" stroke-width="2"/>
  <text x="376" y="197" fill="#1B1E28" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="700">Embeddings</text>
  <text x="376" y="220" fill="#66707D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="500">Multilingual metadata</text>

  <line x1="562" y1="205" x2="620" y2="205" stroke="#B85042" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="640" y="166" width="190" height="78" rx="14" fill="#FAF8F4" stroke="#DED9D0" stroke-width="2"/>
  <text x="664" y="197" fill="#1B1E28" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="700">FAISS Index</text>
  <text x="664" y="220" fill="#66707D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="500">Retrieval artifacts</text>

  <line x1="735" y1="258" x2="735" y2="292" stroke="#B85042" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 7" marker-end="url(#arrow)"/>

  <text x="64" y="298" fill="#B85042" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="700">LIVE QUERY PATH</text>
  <rect x="64" y="318" width="180" height="76" rx="14" fill="#FAF8F4" stroke="#DED9D0" stroke-width="2"/>
  <text x="88" y="349" fill="#1B1E28" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="700">User Query</text>
  <text x="88" y="372" fill="#66707D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="500">KO / EN / JA / ZH</text>

  <line x1="264" y1="356" x2="326" y2="356" stroke="#B85042" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="346" y="318" width="180" height="76" rx="14" fill="#FAF8F4" stroke="#DED9D0" stroke-width="2"/>
  <text x="370" y="349" fill="#1B1E28" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="700">FastAPI</text>
  <text x="370" y="372" fill="#66707D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="500">POST /chat</text>

  <line x1="546" y1="356" x2="608" y2="356" stroke="#B85042" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="628" y="318" width="202" height="76" rx="14" fill="#FAF8F4" stroke="#DED9D0" stroke-width="2"/>
  <text x="652" y="349" fill="#1B1E28" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="700">Retrieve + Rerank</text>
  <text x="652" y="372" fill="#66707D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="500">FAISS semantic search</text>

  <path d="M729 406V424C729 438 718 449 704 449H515" stroke="#B85042" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>

  <rect x="312" y="430" width="180" height="76" rx="14" fill="#FAF8F4" stroke="#DED9D0" stroke-width="2"/>
  <text x="336" y="461" fill="#1B1E28" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="700">Local LLM</text>
  <text x="336" y="484" fill="#66707D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="500">skt/A.X-4.0-Light</text>

  <line x1="292" y1="468" x2="230" y2="468" stroke="#B85042" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="64" y="430" width="146" height="76" rx="14" fill="#FAF8F4" stroke="#DED9D0" stroke-width="2"/>
  <text x="88" y="461" fill="#1B1E28" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="700">Answer</text>
  <text x="88" y="484" fill="#66707D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="500">Markdown output</text>

  <rect x="566" y="450" width="264" height="34" rx="17" fill="#F7F4EF" stroke="#DED9D0"/>
  <text x="596" y="472" fill="#66707D" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="700">Preferences: region, spicy, vegan</text>
</svg>
